<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}APEX — Supercar Configurator{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Druk+Wide+Bold&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:   #060606;
  --black2:  #0e0e0e;
  --black3:  #161616;
  --black4:  #1e1e1e;
  --wire:    #2a2a2a;
  --wire2:   #333;
  --ash:     #555;
  --fog:     #888;
  --mist:    #aaa;
  --snow:    #f0f0f0;
  --white:   #ffffff;
  --red:     #e8170a;
  --red2:    #ff3322;
  --gold:    #c9a84c;
  --gold2:   #f0c060;
  --green:   #3ddc84;
  --speed: 'Oswald', sans-serif;
  --body: 'Familjen Grotesk', sans-serif;
  --mono: 'DM Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--snow);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Noise texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

/* ── NAVIGATION ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  background: rgba(6,6,6,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--wire);
}

.nav-logo {
  font-family: var(--speed);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--white);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-logo-dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.nav-center {
  display: flex;
  gap: 0;
  border: 1px solid var(--wire);
}

.nav-link {
  padding: 8px 20px;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ash);
  text-decoration: none;
  border-right: 1px solid var(--wire);
  transition: all 0.2s;
  font-family: var(--body);
}

.nav-link:last-child { border-right: none; }
.nav-link:hover { color: var(--snow); background: var(--black3); }
.nav-link.active { color: var(--white); background: var(--black3); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.nav-budget {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 1px;
}

.nav-user {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ash);
}

.btn-nav-exit {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid var(--wire2);
  color: var(--ash);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-decoration: none;
  font-family: var(--body);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-nav-exit:hover { border-color: var(--red); color: var(--red); }

/* ── GLOBAL COMPONENTS ── */
.page-root { padding-top: 56px; min-height: 100vh; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 28px;
  font-family: var(--speed);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.08);
  transition: left 0.3s;
}

.btn:hover::before { left: 0; }

.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red2); }
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: var(--gold2); }
.btn-ghost {
  background: transparent;
  color: var(--mist);
  border: 1px solid var(--wire2);
}
.btn-ghost:hover { border-color: var(--snow); color: var(--white); }

/* ── TYPOGRAPHY ── */
.display { font-family: var(--speed); font-weight: 700; text-transform: uppercase; }
.mono { font-family: var(--mono); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: var(--black2); }
::-webkit-scrollbar-thumb { background: var(--red); }

/* ── INPUTS ── */
input, select, textarea {
  background: var(--black3);
  border: 1px solid var(--wire);
  color: var(--snow);
  padding: 11px 14px;
  font-family: var(--body);
  font-size: 14px;
  outline: none;
  width: 100%;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--red); }
input::placeholder { color: var(--ash); }

label {
  display: block;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ash);
  font-weight: 600;
  margin-bottom: 6px;
  font-family: var(--body);
}

.form-group { margin-bottom: 1.2rem; }

/* ── SCORE BARS ── */
.sbar { height: 2px; background: var(--black4); position: relative; }
.sbar-fill { height: 100%; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
.sbar-fill.sp { background: var(--red); }
.sbar-fill.ae { background: var(--gold); }
.sbar-fill.re { background: var(--green); }

/* ── MODALS ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 500;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--black2);
  border: 1px solid var(--wire);
  width: 560px;
  max-width: 95vw;
  max-height: 88vh;
  overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.modal-head {
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--wire);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-family: var(--speed);
  font-size: 1.1rem;
  letter-spacing: 3px;
  font-weight: 600;
}
.modal-close {
  background: none;
  border: none;
  color: var(--ash);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
  transition: color 0.2s;
}
.modal-close:hover { color: var(--red); }
.modal-body { padding: 1.5rem; }

.alert {
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 1rem;
  border-left: 3px solid var(--red);
  background: rgba(232,23,10,0.08);
  color: #ff8880;
}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>

{% if session.user_id %}
<nav>
  <a href="{{ url_for('garage') }}" class="nav-logo">
    <span class="nav-logo-dot"></span>
    APEX
  </a>

  <div class="nav-center">
    <a href="{{ url_for('garage') }}" class="nav-link {% if request.endpoint == 'garage' %}active{% endif %}">Garaje</a>
    <a href="{{ url_for('builder') }}" class="nav-link {% if request.endpoint == 'builder' %}active{% endif %}">Configurador</a>
  </div>

  <div class="nav-right">
    <span class="nav-budget mono" id="global-budget">€{{ "{:,.0f}".format(session.get('budget', 500000)) }}</span>
    <span class="nav-user">{{ session.username }}</span>
    <a href="{{ url_for('logout') }}" class="btn-nav-exit">Salir</a>
  </div>
</nav>
{% endif %}

<div class="page-root">
  {% block content %}{% endblock %}
</div>

{% block extra_js %}{% endblock %}
</body>
</html>
