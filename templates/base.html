<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SuperCar Builder{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E8170A;
            --red-dim: #8C0E06;
            --orange: #FF6B00;
            --gold: #C9A84C;
            --bg: #080808;
            --bg2: #111111;
            --bg3: #1A1A1A;
            --bg4: #222222;
            --surface: #141414;
            --border: #2A2A2A;
            --text: #F0F0F0;
            --text-dim: #888;
            --text-muted: #555;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 400;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanlines overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* NAV */
        nav {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span {
            color: var(--red);
        }

        .nav-logo::before {
            content: '▶';
            color: var(--red);
            font-size: 1rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--red); }
        .nav-links a.active { color: var(--white); }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .nav-budget {
            font-family: 'Share Tech Mono', monospace;
            color: var(--gold);
            font-size: 0.85rem;
        }

        /* BOTONES */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .btn-primary {
            background: var(--red);
            color: white;
        }

        .btn-primary:hover {
            background: #FF2010;
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            clip-path: none;
        }

        .btn-ghost:hover {
            color: var(--white);
            border-color: var(--text-dim);
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
        }

        .btn-gold:hover { background: #D4B86A; }

        /* CARDS */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.5rem;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px;
            height: 100%;
            background: var(--red);
        }

        /* INPUTS */
        input, select, textarea {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: var(--red); }

        input::placeholder { color: var(--text-muted); }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 600;
        }

        .form-group { margin-bottom: 1.2rem; }

        /* SCORE BARS */
        .score-bar {
            height: 4px;
            background: var(--bg4);
            position: relative;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-fill.speed { background: var(--red); }
        .score-fill.aesthetic { background: var(--gold); }
        .score-fill.resale { background: #4CAF50; }

        /* UTILITY */
        .mono { font-family: 'Share Tech Mono', monospace; }
        .heading { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; }
        .text-red { color: var(--red); }
        .text-gold { color: var(--gold); }
        .text-dim { color: var(--text-dim); }

        /* DIVIDER */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        /* ALERT */
        .alert {
            padding: 12px 16px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .alert-error {
            background: rgba(232, 23, 10, 0.1);
            border: 1px solid var(--red-dim);
            color: #FF6B6B;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--red-dim); }

        /* PAGE WRAPPER */
        .page-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 4px;
            line-height: 1;
        }

        .page-subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if session.user_id %}
    <nav>
        <a href="{{ url_for('garage') }}" class="nav-logo">SUPER<span>CAR</span> BUILDER</a>
        <div class="nav-links">
            <a href="{{ url_for('garage') }}" {% if request.endpoint == 'garage' %}class="active"{% endif %}>Garaje</a>
            <a href="{{ url_for('builder') }}" {% if request.endpoint == 'builder' %}class="active"{% endif %}>Configurador</a>
        </div>
        <div class="nav-user">
            <span>{{ session.username }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-ghost" style="padding:6px 16px;font-size:0.75rem;">SALIR</a>
        </div>
    </nav>
    {% endif %}

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
